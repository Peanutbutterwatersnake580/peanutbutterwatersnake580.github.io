name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A6FEBE: ${{ secrets.A6FEBE }}
          B0F978: ${{ secrets.B0F978 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A6FEBE', '')
          tag_b = os.environ.get('B0F978', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- e8a9350a0e8894898aab509f2fa9d8422f -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 608274c3bc5ea24388ddfe130a -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
